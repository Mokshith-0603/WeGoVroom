<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ff6b00">
    <title>Open WeGoVroom Trip</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fffaf6; color: #181818; }
      main { width: min(88vw, 420px); text-align: center; padding: 32px 24px; border-radius: 24px; background: white; box-shadow: 0 18px 50px rgba(61, 34, 15, .12); }
      h1 { margin: 0 0 12px; font-size: 30px; }
      .brand { color: #ff6b00; }
      p { margin: 0 0 24px; line-height: 1.5; color: #606060; }
      a { display: block; padding: 15px 20px; border-radius: 999px; background: #ff6b00; color: white; font-weight: 700; text-decoration: none; }
      small { display: block; margin-top: 18px; color: #858585; }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="brand">WeGo</span>Vroom</h1>
      <p>Open this invitation in WeGoVroom to view the trip and join your travel group.</p>
      <a id="open-app" href="https://play.google.com/store/apps/details?id=com.wegovroom.app">Open or install WeGoVroom</a>
      <small>If the app is not installed, you will be taken to Google Play.</small>
    </main>
    <script>
      (function () {
        var match = window.location.pathname.match(/^\/trip\/([^/]+)/);
        var queryTripId = new URLSearchParams(window.location.search).get('tripId');
        var tripId = match ? decodeURIComponent(match[1]) : queryTripId;
        var playStore = 'https://play.google.com/store/apps/details?id=com.wegovroom.app';
        var target = playStore;

        if (tripId) {
          target = 'intent://trip/' + encodeURIComponent(tripId)
            + '#Intent;scheme=wegovroom;package=com.wegovroom.app;'
            + 'S.browser_fallback_url=' + encodeURIComponent(playStore) + ';end';
        }

        document.getElementById('open-app').href = target;
        if (/Android/i.test(navigator.userAgent)) {
          window.location.replace(target);
        }
      })();
    </script>
  </body>
</html>
